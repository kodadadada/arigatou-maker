# タグ（v1.0.0 など）をプッシュすると、Mac（.dmg）と Windows（.exe）のアプリを作って Releases に置く
name: アプリをビルドして公開

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 署名なしで作る（Mac は ad-hoc 署名のみ）
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "ありがとう演出メーカー $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
